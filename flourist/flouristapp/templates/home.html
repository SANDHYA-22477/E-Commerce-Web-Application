 {% extends 'base.html' %}
{% load static %}

{% block content %}
 

<!-- BANNER -->
<div class="container-fluid p-0">
    <div class="banner" style="width:100%; height:60vh;">
        <img src="/media/banner.jpg"
             alt="Banner"
             style="width:100%; height:100%; object-fit:cover;">
    </div>
</div>

<!-- PRODUCTS -->
<div class="container mt-5">
    <div class="row">

        {% for i in post %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="{{ i.image.url }}" class="card-img-top" height="250">

                <div class="card-body text-center">
                    <h5>{{ i.name }}</h5>
                    <p>₹{{ i.price }}</p>

                    <a href="{% url 'add_to_cart' 'Home' i.id %}" class="btn btn-primary mt-2">
                        🛒 Add to Cart
                    </a>

                    <div class="mt-2">
                        <a href="{% url 'add_to_wishlist' i.id 'Home' %}">
                            ★ Add to Wishlist
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}

    </div>
</div>

 <!-- 🤖 AI BOX -->
<div id="ai-box">
    <h5>🤖 AI Assistant</h5>

    <input type="text" id="msg" placeholder="Type message">

    <div class="button-group">

        <button type="button" onclick="startVoice()">
            🎤 Speak
        </button>

        <button type="button" onclick="endMessage(event)">
            Send
        </button>

    </div>

    <div id="chat-box"></div>
</div>

{% endblock %}
