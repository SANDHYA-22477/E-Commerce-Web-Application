 {% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
     {% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
{% endblock %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="profile-container">

     <div class="profile-card">

     <!-- PROFILE HEADER -->
<div class="profile-header">
 <div class="img-box">
 {% if profile.profile_image %}
    <img class="profile-img" src="{{ profile.profile_image.url }}" width="60" height="40">
{% else %}
    <img class="profile-img" src="{% static 'images/default.png' %}" width="60" height="40">
{% endif %}

</div>

    <h2>{{ request.user.username }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="file" name="profile_image" id="uploadImg" hidden
               onchange="this.form.submit()">

        <label for="uploadImg" class="edit-btn">
            <i class="fa fa-pen"></i> Edit Profile
        </label>

    </form>

</div>
    <!-- PROFILE INFO -->
<form method="POST">
    {% csrf_token %}

    <div class="profile-info">

        <div class="info-box">
            <label>Name</label>
            <input type="text" name="first_name" value="{{ request.user.first_name }}">
            <input type="text" name="last_name" value="{{ request.user.last_name }}">
        </div>

        <div class="info-box">
            <label>Username</label>
            <input type="text" value="{{ request.user.username }}" disabled>
        </div>

        <div class="info-box">
            <label>Email</label>
            <input type="email" value="{{ request.user.email }}" disabled>
        </div>

        <div class="info-box">
            <label>Phone</label>
            <input type="text" name="phone" value="{{ profile.phone }}">
            <i class="fa fa-pen edit-icon"></i>
        </div>

        <div class="info-box">
            <label>Address</label>
            <input type="text" name="address" value="{{ profile.address }}">
            <i class="fa fa-pen edit-icon"></i>
        </div>

        <div class="info-box">
            <label>Birthday</label>
            <input type="date" name="birthday" value="{{ profile.birthday }}">
            <i class="fa fa-pen edit-icon"></i>
        </div>

        <!-- SAVE BUTTON -->
        <button type="submit" class="save-btn">
            Save 
        </button>

    </div>
</form>
     
        <!-- ACTION BUTTONS -->
        <div class="profile-actions">

            <a href="{% url 'orders' %}" class="btn">
                <i class="fa fa-box"></i> My Orders
            </a>

            <a href="{% url 'tracking' %}" class="btn">
                <i class="fa fa-truck"></i> Track Order
            </a>

        </div>

    </div>

</div>

</body>
</html>
