 {% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Wishlist</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

{% for i in items %}
<div class="wishlist-card">

    {% if i.product_image %}
        <img src="{{ i.product_image.url }}" class="wishlist-img">
    {% endif %}

    <div class="wishlist-info">
         <h4>{{ i.product_name }}</h4>
<small>Added on {{ i.created_at|date:"d M Y" }}</small>
    </div>

     <div class="wishlist-actions">
    <a href="{% url 'home' %}" class="btn btn-outline-danger">Continue Shopping</a>
    <a href="{% url 'home' %}" class="btn btn-primary">Buy Now</a>
    <a href="{% url 'remove_wishlist' i.id %}" class="btn btn-dark">Remove</a>
</div>
</div>
{% empty %}
<div class="text-center">
    <h4>Your wishlist is empty</h4>
</div>
{% endfor %}

</body>
</html>
