 {% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Track Orders</title>

    <style>

    body{
        background:#f5f5f5;
        font-family:Arial,sans-serif;
        margin:0;
        padding:0;
    }

    .container{
        width:90%;
        max-width:1000px;
        margin:40px auto;
    }

    .title{
        text-align:center;
        margin-bottom:30px;
        color:#333;
    }

    .card{
        background:white;
        padding:25px;
        border-radius:15px;
        margin-bottom:30px;
        box-shadow:0 3px 10px rgba(0,0,0,0.1);
    }

    .product{
        display:flex;
        align-items:center;
        gap:20px;
        margin-bottom:30px;
    }

    .product img{
        width:120px;
        height:120px;
        object-fit:cover;
        border-radius:10px;
    }

    .product h3{
        margin:0;
    }

    /* TRACKING BAR */

    .track{
        display:flex;
        justify-content:space-between;
        position:relative;
        margin-top:40px;
    }

    .track::before{
        content:'';
        position:absolute;
        top:22px;
        left:10%;
        width:80%;
        height:5px;
        background:#ddd;
        z-index:1;
    }

    .step{
        position:relative;
        z-index:2;
        text-align:center;
        flex:1;
    }

    .circle{
        width:45px;
        height:45px;
        border-radius:50%;
        background:#ccc;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        margin:auto;
        font-weight:bold;
    }

    .active .circle{
        background:#28a745;
    }

    .label{
        margin-top:10px;
        font-size:14px;
        font-weight:bold;
    }

    </style>
</head>

<body>

<div class="container">

    <h1 class="title">Track Your Orders</h1>

    {% for order in orders %}

    <div class="card">

        <div class="product">

            {% if order.product_image %}
            <img src="{{ order.product_image.url }}">
            {% endif %}

            <div>
                <h3>{{ order.product_name }}</h3>
                <p>Current Status: {{ order.status }}</p>
            </div>

        </div>

        <div class="track">

            <div class="step active">
                <div class="circle">✓</div>
                <div class="label">Pending</div>
            </div>

            <div class="step {% if order.status == 'Processing' or order.status == 'Shipped' or order.status == 'Delivered' %}active{% endif %}">
                <div class="circle">✓</div>
                <div class="label">Processing</div>
            </div>

            <div class="step {% if order.status == 'Shipped' or order.status == 'Delivered' %}active{% endif %}">
                <div class="circle">✓</div>
                <div class="label">Shipped</div>
            </div>

            <div class="step {% if order.status == 'Delivered' %}active{% endif %}">
                <div class="circle">✓</div>
                <div class="label">Delivered</div>
            </div>

        </div>

    </div>

    {% endfor %}

</div>

</body>
</html>
