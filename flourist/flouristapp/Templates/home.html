 {% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- BANNER -->
<div class="container-fluid p-0">
    <div class="banner">
        <img src="/media/banner.jpg" alt="Banner" class="img-fluid">
    </div>
</div>

<!-- PRODUCTS -->
<div class="container mt-5">
    <div class="row">

        {% for i in post %}

        <div class="col-md-4 mb-4">

            <div class="card">

                <img src="{{ i.image.url }}" class="card-img-top" height="250">

                <div class="card-body text-center">

                    <h5>{{ i.name }}</h5>

                    <p>₹{{ i.price }}</p>

                       
             <!-- CART BUTTON -->
               
                  <a href="{% url 'add_to_cart' 'Home' i.id %}" class="btn btn-primary mt-2">
                     🛒 Add to Cart
                </a>
                </a>
                    <!-- WISHLIST -->
                    <div class="wishlist-bottom">
                        <a href="{% url 'add_to_wishlist' i.id 'Home' %}" class="wishlist-text">
                            ★ Add to Wishlist
                        </a>
                    </div>

                </div>
            </div>

        </div>

        {% endfor %}

    </div>
</div>

{% endblock %}
