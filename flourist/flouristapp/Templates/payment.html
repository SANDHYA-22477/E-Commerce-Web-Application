 {% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4" style="max-width:700px;margin:auto;border-radius:15px;">

        <h2 class="text-center text-success mb-4">Secure Payment</h2>

        <div class="text-center">
            <img src="{{ item.image.url }}" width="220" height="220" class="rounded">
            <h3 class="mt-3">{{ item.name }}</h3>
            <h4 class="text-primary">₹{{ item.price }}</h4>
        </div>

        <hr>

        <h4>Select Payment Method</h4>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" onclick="goToScan()">
            <label class="form-check-label">🟢 Google Pay</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" onclick="goToScan()">
            <label class="form-check-label">🟣 PhonePe</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" onclick="showForm('card')">
            <label class="form-check-label">💳 Card</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" onclick="showForm('upi')">
            <label class="form-check-label">🏦 UPI</label>
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" type="radio" name="payment" onclick="showForm('cod')">
            <label class="form-check-label">💵 Cash On Delivery</label>
        </div>

        <!-- CARD -->
        <div id="card" style="display:none;">
            <input class="form-control mb-2" placeholder="Name On Card">
            <input class="form-control mb-2" placeholder="Card Number">

            <div class="row">
                <div class="col">
                    <input class="form-control" placeholder="MM/YY">
                </div>

                <div class="col">
                    <input class="form-control" placeholder="CVV">
                </div>
            </div>

            <button class="btn btn-success w-100 mt-3">Pay Now</button>
        </div>

        <!-- UPI -->
        <div id="upi" style="display:none;">
            <input class="form-control mb-3" placeholder="example@okaxis">

            <button class="btn btn-success w-100">
                Pay Now
            </button>
        </div>

        <!-- COD -->
        <div id="cod" style="display:none;">
            <textarea class="form-control mb-3"
                      rows="3"
                      placeholder="Delivery Address"></textarea>

            <button class="btn btn-success w-100">
                Place Order
            </button>
        </div>

    </div>

</div>

<script>

function goToScan(){
    window.location.href="{% url 'scan_payment' model_name item.id %}";
}

function showForm(type){

    document.getElementById("card").style.display="none";
    document.getElementById("upi").style.display="none";
    document.getElementById("cod").style.display="none";

    document.getElementById(type).style.display="block";
}

</script>

{% endblock %}
