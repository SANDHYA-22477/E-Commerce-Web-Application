 {% for i in cart %}

<div class="card p-3 mb-3 text-center">

    <img src="{{ i.image }}" width="120">

    <h4>{{ i.name }}</h4>
    <p>₹{{ i.price }}</p>

    {% if i.model == "Home" %}
        <a href="{% url 'home_payment' i.id %}" class="btn btn-primary">
            Proceed Payment
        </a>

    {% elif i.model == "Men" %}
        <a href="{% url 'men_payment' i.id %}" class="btn btn-primary">
            Proceed Payment
        </a>

    {% elif i.model == "Women" %}
        <a href="{% url 'women_payment' i.id %}" class="btn btn-primary">
            Proceed Payment
        </a>

    {% elif i.model == "Kids" %}
        <a href="{% url 'kids_payment' i.id %}" class="btn btn-primary">
            Proceed Payment
        </a>
    {% endif %}

</div>

{% empty %}
    <h3>No items in cart</h3>
{% endfor %}
